server:
  port: 8802
  servlet:
    context-path: /file
spring:
  application:
    name: smilex-cloud-file
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        # 命名空间
        namespace: dev
        # 注册中鼎
        server-addr: 127.0.0.1:8848
      config:
        # 命名空间
        namespace: dev
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    show-extensions: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: top.zsmile.cloud.file


