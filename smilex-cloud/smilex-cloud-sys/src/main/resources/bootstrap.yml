server:
  port: 8801
  servlet:
    context-path: /sys
spring:
  application:
    name: smilex-cloud-sys
  profiles:
    active: dev
  cloud:
    nacos:
      # 用戶认证，如果需要分离，直接放大送discovery/config下面
      username: nacos
      password: nacos
      discovery:
        # 命名空间
        namespace: dev
        # 注册中鼎
        server-addr: 127.0.0.1:8848
      config:
        # 命名空间
        namespace: dev
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
#  config:
#    import: optional:nacos:127.0.0.1:8848:application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

smilex:
  nacos:
    listener:
      refresh-db:
        enabled: true
        dataId: ${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        group:

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    show-extensions: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: top.zsmile.cloud.sys,top.zsmile.modules.sys
knife4j:
  # 开启增强
  enable: true
  # 开启生产环境保护
  production: false
  # 设置
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
    home-custom-path:
  # 开启Swagger的Basic认证功能,默认是false
  basic:
    enable: false
    # Basic认证用户名
    username: knifeAdmin
    # Basic认证密码
    password: knifeAdmin
  openapi:
    title: ${spring.application.name} Docs
    description: Api Doc
    concat: smilex
    version: v4.0
    license: Apache 2.0
    license-url: https://stackoverflow.com/
    terms-of-service-url: https://stackoverflow.com/
    group:
      test1:
        group-name: 分组名称
        api-rule: package
        api-rule-resources:
          - top.zsmile.cloud.sys