server:
  port: 8809
  servlet:
    context-path: /gateway

spring:
  application:
    name: smilex-cloud-gateway
  cloud:
    sentinel:
      eager:
      transport:
        port: 8719
        dashboard: 127.0.0.1:8720
    nacos:
      discovery:
        # 命名空间
        namespace: dev
        # 注册中鼎
        server-addr: 127.0.0.1:8848
      config:
        # 命名空间
        namespace: dev
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: smilex-cloud-sys         #路由的ID，没有固定规则但要求唯一，建议配合服务名
          uri: lb://smilex-cloud-sys    #匹配后提供服务的路由地址
          predicates:
            - Path=/sys/**    #断言，路径相匹配的进行路由

# 网关文档聚合：通过 Nacos 服务发现自动聚合各子服务的 OpenAPI3 文档
# 聚合入口：http://localhost:8809/gateway/doc.html
knife4j:
  gateway:
    enabled: true
    # discover 模式基于 DiscoveryClient 自动发现子服务，要求子服务统一 OpenAPI3 规范
    strategy: discover
    discover:
      enabled: true
      version: openapi3
      # 排除网关自身等无文档服务
      excluded-services:
        - smilex-cloud-gateway




