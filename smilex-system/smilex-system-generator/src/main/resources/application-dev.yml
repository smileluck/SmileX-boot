server:
  port: 8081
  servlet:
    context-path: /smilex
spring:
  mvc:
    static-path-pattern: /static/**
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    type: com.alibaba.druid.pool.xa.DruidXADataSource
    druid:
      # 连接池监控
      stat-view-servlet:
        enabled: true
        loginUsername: druidAdmin
        loginPassword: druidAdmin
        allow: 127.0.0.1
        url-pattern: /druid/*
      # web Url 结案空
      web-stat-filter:
        enabled: true
    dynamic:
      druid: # 全局druid参数，绝大部分值和默认保持一致。(现已支持的参数如下,不清楚含义不要乱设置)
        # 连接池的配置信息
        # 初始化大小，最小，最大
        keep-alive: true
        initial-size: 5
        min-idle: 5
        max-active: 20
        # 配置获取连接等待超时的时间
        max-wait: 60000
        # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        time-between-eviction-runs-millis: 60000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        # 打开PSCache，并且指定每个连接上PSCache的大小
        pool-prepared-statements: true
        #      init-exception-throw: true
        max-pool-prepared-statement-per-connection-size: 20
        # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        filters: stat,wall,slf4j
        # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
        connection-properties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/smilex-boot?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: root
          password: 123456
  freemarker:
    suffix: .html
    template-loader-path: classpath:/templates/

# MyBatis
mybatis:
  mapperLocations: classpath*:/mapper/**/*.xml
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回类型为Map,显示null对应的字段
    call-setters-on-nulls: true





# smilex-config
smilex:
  generator:
    # 访问令牌（配置后 /generator/** 与 /druid/** 需携带请求头 X-Generator-Token；留空=不启用，仅建议本地开发）
    security:
      token: ""
    # 雪花 ID（与主应用 smilex.server.workerId 错开，避免菜单 ID 冲突）
    worker-id: 2
    datacenter-id: 2
    # 本地生成的根目录白名单（空=不限制，但始终拒绝 .. 越界）
    save-root: ""
  server:
    workerId: 1
    dataCenterId: 1
  upload:
    # Local 本地, oss 阿里云OSS, minio
    type: local
    oss:
      accessKey: ??
      secretKey: ??
      endpoint: ??
      bucketName: SmileX
    minio:
      minioUrl: ??
      minioName: ??
      minioPass: ??
      bucketName: SmileX
